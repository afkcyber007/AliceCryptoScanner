<div class="tool-grid">
  <form class="fields" onsubmit="return false">
    <div class="field full"><span class="lbl">Direction</span>
      <div class="seg" role="group" aria-label="Direction" data-name="side"><button type="button" data-v="long" aria-pressed="true">Long (buy)</button><button type="button" data-v="short" aria-pressed="false">Short (sell)</button></div></div>
    <div class="field"><label for="rr-entry">Entry price</label><input id="rr-entry" name="entry" type="number" inputmode="decimal" step="any" value="1.0850"></div>
    <div class="field"><label for="rr-sl">Stop loss</label><input id="rr-sl" name="sl" type="number" inputmode="decimal" step="any" value="1.0820"></div>
    <div class="field"><label for="rr-tp">Take profit</label><input id="rr-tp" name="tp" type="number" inputmode="decimal" step="any" value="1.0940"></div>
    <div class="field"><label for="rr-risk">Money at risk (optional)</label><input id="rr-risk" name="risk" type="number" inputmode="decimal" min="0" step="any" value="100"></div>
  </form>
  <div class="results" aria-live="polite">
    <div class="result big"><span>Risk : reward</span><b data-out="ratio">--</b></div>
    <div class="result"><span>Risk distance</span><b data-out="riskd">--</b></div>
    <div class="result"><span>Reward distance</span><b data-out="rewd">--</b></div>
    <div class="result"><span>Potential profit</span><b data-out="profit">--</b></div>
    <div class="result"><span>Break-even win rate</span><b data-out="be">--</b></div>
    <p class="tool-hint" data-out="note"></p>
  </div>
</div>
