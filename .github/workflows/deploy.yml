name: Publish website

# Runs on every change. If you uploaded AliceWebsite.zip (or "AliceWebsite (1).zip"), it is unpacked first.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack the uploaded zip (if there is one)
        run: |
          ZIP=$(ls -t AliceWebsite*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No zip uploaded, building the current files."; exit 0; fi
          echo "Unpacking $ZIP"
          unzip -o "$ZIP" -d .
          rm -f AliceWebsite*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $ZIP" || echo "Nothing new to commit"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed, retrying in 5 s…"; sleep 5
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the website
        run: |
          pip install markdown==3.7
          python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
